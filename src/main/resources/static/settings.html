<!DOCTYPE html>
<html class="light" lang="ru">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <style>html.auth-pending body {visibility: hidden;}</style>
    <script>document.documentElement.classList.add('auth-pending');</script>
    <script src="js/auth.js"></script>
    <script>window.BPSAuth.guardProtectedPage('login.html');</script>
    <title>Настройки системы - LamartBPS</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/settings.css"/>
    <link rel="icon" href="images/lamart.svg" type="image/svg+xml">
    <style>
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }
    </style>
    <script id="tailwind-config" src="js/settings-tailwind-config.js"></script>
</head>

<body class="bg-surface text-on-surface min-h-screen pb-32">
<header class="sticky top-0 w-full z-50 bg-[#fbf8ff]/70 dark:bg-[#171a2f]/70 backdrop-blur-3xl shadow-[0px_20px_40px_rgba(23,26,47,0.06)]">
    <nav class="flex items-center justify-between px-10 h-20 max-w-[1920px] mx-auto">
        <div class="flex items-center gap-8">
            <span class="text-xl font-black tracking-tighter text-[#171a2f] dark:text-[#fbf8ff]">LamartBPS</span>
            <div class="flex items-center gap-4">
                <button id="backBtn" class="flex items-center gap-2 text-blue-700 font-inter tracking-tight text-sm font-medium transition-all scale-95 active:scale-90">
                    <span class="material-symbols-outlined">arrow_back</span>
                    Вернуться назад
                </button>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button class="hidden p-2 text-[#404753] active:scale-95 transition-transform ease-out">
                <span class="hidden material-symbols-outlined" data-icon="notifications">notifications</span>
            </button>
            <button class="hidden p-2 text-[#404753] active:scale-95 transition-transform ease-out">
                <span class="hidden material-symbols-outlined" data-icon="settings">settings</span>
            </button>
            <div class="relative">
                <button id="user-avatar-btn" class="block h-8 w-8 md:h-10 md:w-10 rounded-full overflow-hidden bg-surface-container-highest border-2 border-primary-container/20 focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all hover:scale-105 active:scale-95">
                    <img alt="User Profile" class="h-full w-full object-cover" src="images/avatar.png" />
                </button>
                <div id="user-dropdown-menu" class="hidden absolute right-0 mt-2 w-48 bg-surface-container-lowest border border-outline-variant/20 rounded-xl shadow-[0px_10px_20px_rgba(23,26,47,0.1)] z-50 overflow-hidden">
                    <button id="logout-btn" class="w-full text-left px-4 py-3 text-sm font-bold text-error hover:bg-error-container/20 transition-colors flex items-center gap-3">
                        <span class="material-symbols-outlined text-error text-lg">logout</span>
                        Выйти из системы
                    </button>
                </div>
            </div>
        </div>
    </nav>
</header>
<div class="flex justify-center max-w-[1440px] mx-auto">
    <main class="w-full px-6 md:px-12 py-10 max-w-4xl mx-auto">
        <header class="mb-12">
            <h1 class="text-4xl font-extrabold tracking-tight text-on-surface mb-2">Настройки системы</h1>
            <p class="text-on-surface-variant body-md opacity-80">Управление параметрами аналитики и интеграциями.</p>
        </header>
        <div class="space-y-8">
            <section class="glass-panel p-8 rounded-lg shadow-[0px_20px_40px_rgba(23,26,47,0.06)] group transition-all duration-300 hover:translate-y-[-2px]">
                <div class="flex items-center gap-3 mb-6">
                    <span class="material-symbols-outlined text-primary">warning</span>
                    <h2 class="text-xl font-bold tracking-tight">Настройки скоринга</h2>
                </div>
                <div class="grid md:grid-cols-2 gap-6 mb-6">
                    <div class="space-y-2">
                        <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant">Повышенный риск (Purple)</label>
                        <input id="greenThreshold" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/20 transition-all text-sm outline-none" type="number" step="0.01" />
                    </div>
                    <div class="space-y-2">
                        <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant">Высокий риск (Red)</label>
                        <input id="yellowThreshold" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/20 transition-all text-sm outline-none" type="number" step="0.01" />
                    </div>
                </div>
                <div class="space-y-2 border-t border-outline-variant/20 pt-6">
                    <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant flex justify-between">
                        <span>Инерция памяти (EMA Alpha)</span>
                        <span class="text-primary normal-case font-medium">От 0.01 до 0.5</span>
                    </label>
                    <input id="scoringAlpha" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/20 transition-all text-sm outline-none" type="number" step="0.01" min="0.01" max="0.5" />
                </div>
            </section>

            <section class="glass-panel p-8 rounded-lg shadow-[0px_20px_40px_rgba(23,26,47,0.06)] group transition-all duration-300 hover:translate-y-[-2px]">
                <div class="flex items-center gap-3 mb-6">
                    <span class="material-symbols-outlined text-primary">dynamic_form</span>
                    <h2 class="text-xl font-bold tracking-tight">Jira API</h2>
                </div>
                <div class="space-y-6">
                    <div class="space-y-2">
                        <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant">Jira URL</label>
                        <input id="jiraUrl" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/20 transition-all text-sm outline-none" type="text" />
                    </div>
                    <div class="grid md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant">Service Email</label>
                            <div class="relative">
                                <input id="jiraUsername" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 pr-12 focus:ring-2 focus:ring-primary/20 transition-all text-sm outline-none placeholder-on-surface-variant/50" type="password" placeholder="Email зашифрован в БД" autocomplete="off" />
                                <button type="button" class="toggle-password absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 hover:text-primary transition-colors focus:outline-none">
                                    <span class="material-symbols-outlined text-[20px]">visibility</span>
                                </button>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant">API Token</label>
                            <div class="relative">
                                <input id="jiraToken" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 pr-12 focus:ring-2 focus:ring-primary/20 transition-all text-sm outline-none placeholder-on-surface-variant/50" type="password" placeholder="Токен зашифрован в БД" autocomplete="off" />
                                <button type="button" class="toggle-password absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 hover:text-primary transition-colors focus:outline-none">
                                    <span class="material-symbols-outlined text-[20px]">visibility</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="glass-panel p-8 rounded-lg shadow-[0px_20px_40px_rgba(23,26,47,0.06)] group transition-all duration-300 hover:translate-y-[-2px]">
                <div class="flex items-center gap-3 mb-6">
                    <span class="material-symbols-outlined text-primary">account_tree</span>
                    <h2 class="text-xl font-bold tracking-tight">GitHub API</h2>
                </div>
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant">Organization / Owner</label>
                        <input id="githubOwner" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/20 transition-all text-sm outline-none" type="text" />
                    </div>
                    <div class="space-y-2">
                        <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant">Personal Access Token</label>
                        <div class="relative">
                            <input id="githubToken" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 pr-12 focus:ring-2 focus:ring-primary/20 transition-all text-sm outline-none placeholder-on-surface-variant/50" type="password" placeholder="Токен зашифрован в БД" autocomplete="off" />
                            <button type="button" class="toggle-password absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 hover:text-primary transition-colors focus:outline-none">
                                <span class="material-symbols-outlined text-[20px]">visibility</span>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="glass-panel p-8 rounded-lg shadow-[0px_20px_40px_rgba(23,26,47,0.06)] group transition-all duration-300 hover:translate-y-[-2px]">
                <div class="flex items-center gap-3 mb-6">
                    <span class="material-symbols-outlined text-primary">straighten</span>
                    <h2 class="text-xl font-bold tracking-tight">Параметры сбора метрик</h2>
                </div>
                <div class="space-y-6">
                    <div class="grid md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant">Часовой пояс по умолчанию</label>
                            <select id="timezone" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/20 transition-all text-sm outline-none">
                                <option value="Asia/Yekaterinburg">Екатеринбург (GMT+05:00)</option>
                                <option value="Europe/Moscow">Москва / Санкт-Петербург (GMT+03:00)</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant">Изолированное событие (секунды)</label>
                            <input id="isolatedEventDurationSeconds" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/20 transition-all text-sm outline-none" type="number" title="Сколько секунд работы засчитывается за 1 одиночный коммит" />
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant">Мин. длина commit (символы)</label>
                            <input id="minCommitLength" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/20 transition-all text-sm outline-none" type="number" />
                        </div>
                        <div class="space-y-2">
                            <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant">Done Statuses (Jira Tasks)</label>
                            <input id="doneStatuses" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/20 transition-all text-sm outline-none" placeholder="Done,Closed,Resolved" type="text" />
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant">Игнорируемые слова (Bad Commits)</label>
                        <textarea id="boilerplateWords" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/20 transition-all text-sm outline-none resize-none" rows="3"></textarea>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>
<footer class="fixed bottom-0 w-full z-50 bg-white/80 backdrop-blur-2xl border-t border-slate-100 flex justify-end items-center px-12 py-6 gap-6 shadow-[0px_-10px_30px_rgba(0,0,0,0.03)]">
    <button id="resetBtn" class="text-slate-400 hover:text-slate-600 px-4 py-2 font-inter text-xs uppercase tracking-widest font-bold transition-opacity active:scale-98">
        Сбросить до заводских
    </button>
    <button id="saveBtn" class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-8 py-3 rounded-full font-inter text-xs uppercase tracking-widest font-bold shadow-lg hover:opacity-90 transition-all active:scale-95">
        Сохранить изменения
    </button>
</footer>
<script src="js/settings.js"></script>
</body>
</html>
