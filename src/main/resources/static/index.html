<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд Выгорания (Burnout Prediction)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .header { text-align: center; color: #333; margin-bottom: 30px; }
        .dashboard { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 400px; }
        .table-container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 900px; margin: 20px auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; }
        .badge { padding: 5px 10px; border-radius: 20px; color: white; font-weight: bold; font-size: 0.9em; }
        .badge.GREEN { background-color: #28a745; }
        .badge.YELLOW { background-color: #ffc107; color: #333; }
        .badge.RED { background-color: #dc3545; }
        .uuid { font-family: monospace; color: #666; font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Система прогнозирования выгорания IT-специалистов</h1>
        <p>Аналитика на основе активности в Jira и GitHub</p>
    </div>
    <div class="dashboard">
        <div class="card">
            <h3 style="text-align: center;">Уровень выгорания в компании</h3>
            <div style="position: relative; height: 300px; width: 100%;">
                <canvas id="burnoutChart"></canvas>
            </div>
        </div>
    </div>
    <div class="table-container">
        <h3>Детальный список сотрудников (Анонимизировано)</h3>
        <table id="employeesTable">
            <thead>
            <tr>
                <th>UUID Сотрудника</th>
                <th>Команда</th>
                <th>Должность</th>
                <th>Риск (%)</th>
                <th>Статус</th>
            </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <script>
        async function fetchBurnoutData() {
            try {
                const response = await fetch('/api/v1/burnout/summary');
                const data = await response.json();

                renderChart(data);
                renderTable(data);
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                alert('Не удалось загрузить данные с сервера!');
            }
        }

        function renderChart(data) {
            let greenCount = 0, yellowCount = 0, redCount = 0;

            data.forEach(emp => {
                if (emp.statusColor === 'GREEN') greenCount++;
                if (emp.statusColor === 'YELLOW') yellowCount++;
                if (emp.statusColor === 'RED') redCount++;
            });

            const ctx = document.getElementById('burnoutChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Здоровы (Green)', 'В зоне риска (Yellow)', 'Выгорание (Red)'],
                    datasets: [{
                        data: [greenCount, yellowCount, redCount],
                        backgroundColor: ['#28a745', '#ffc107', '#dc3545']
                    }]
                },
                options: { responsive: true }
            });
        }

        function renderTable(data) {
            const tbody = document.querySelector('#employeesTable tbody');
            tbody.innerHTML = '';

            data.sort((a, b) => b.riskProbability - a.riskProbability);

            data.forEach(emp => {
                const tr = document.createElement('tr');
                const riskPercent = (emp.riskProbability * 100).toFixed(1) + '%';

                tr.innerHTML = `
                    <td class="uuid">${emp.employeeId}</td>
                    <td>${emp.teamName}</td>
                    <td>${emp.role}</td>
                    <td><strong>${riskPercent}</strong></td>
                    <td><span class="badge ${emp.statusColor}">${emp.statusColor}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }
        fetchBurnoutData();
    </script>
</body>
</html>
